name: Detector de IA

on:
  schedule:
    - cron: "*/10 * * * *"   # a cada 10 minutos (o GitHub pode atrasar alguns minutos)
  workflow_dispatch:
    inputs:
      todas:
        description: "Investigar todas as músicas (não só as novas)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: detector
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      novas: ${{ steps.v.outputs.novas }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - id: v
        name: Tem música nova?
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python -m detector.novas
      - name: Manter o agendamento vivo
        # o GitHub desliga agendamentos de repositórios sem commits há 60 dias
        run: |
          ultimo=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - ultimo )) -gt $(( 45 * 86400 )) ]; then
            date -u +%FT%TZ > estado/batimento.txt
            git config user.name "detector-musica-ia[bot]"
            git config user.email "detector-musica-ia@users.noreply.github.com"
            git add estado/batimento.txt && git commit -m "Batimento: detector ativo" && git push
          fi

  detectar:
    needs: verificar
    if: needs.verificar.outputs.novas != '0' || inputs.todas
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependências
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Investigar músicas
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python -m detector.main ${{ inputs.todas && '--todas' || '' }}
      - name: Guardar relatório
        run: |
          git config user.name "detector-musica-ia[bot]"
          git config user.email "detector-musica-ia@users.noreply.github.com"
          git pull -q --rebase
          git add relatorios estado
          git diff --cached --quiet || (git commit -m "Relatório do detector" && git push)
